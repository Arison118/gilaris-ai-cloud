
name: GILARIS AI - Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --input-type=module --check < worker.js

      - name: Setup Wrangler
        run: npm install --global wrangler@4.156.1

      - name: Validate Cloudflare configuration
        run: wrangler deploy --dry-run --outdir=dist --config=wrangler.jsonc
        
